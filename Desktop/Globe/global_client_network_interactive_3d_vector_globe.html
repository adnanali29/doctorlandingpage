<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Client Network - Interactive 3D Vector Globe</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Three.js Core & OrbitControls (Stable Standalone CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #1f2937;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Glassmorphism Panel Styling */
        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 4px 10px -2px rgba(0, 0, 0, 0.02);
        }

        .glass-panel-dark {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f8fafc;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.3);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Canvas Container */
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            cursor: grab;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        /* 2D Overlay Markers over 3D Globe */
        .globe-label {
            position: absolute;
            transform: translate(-50%, -100%);
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            white-space: nowrap;
            user-select: none;
            z-index: 10;
        }

        .globe-label:hover {
            transform: translate(-50%, -108%) scale(1.08);
        }
    </style>
</head>
<body class="relative min-h-screen bg-white select-none">

    <!-- 3D Three.js Vector Globe Canvas Container -->
    <div id="canvas-container"></div>

    <!-- HTML Marker Overlay Container -->
    <div id="html-markers-container" class="absolute inset-0 pointer-events-none z-10 overflow-hidden"></div>

    <!-- Selected Country HUD Spotlight Card -->
    <div id="spotlightCard" class="absolute bottom-6 left-4 md:left-6 z-20 w-80 glass-panel-dark rounded-2xl p-4 transition-all duration-500 transform translate-y-3 opacity-0 pointer-events-none">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span id="spotlightFlag" class="text-3xl">🌐</span>
                <div>
                    <h3 id="spotlightName" class="font-bold text-base text-white leading-tight">Country Name</h3>
                    <p id="spotlightRegion" class="text-xs text-gray-400 mt-0.5">Region Info</p>
                </div>
            </div>
            <button id="closeSpotlightBtn" class="text-gray-400 hover:text-white pointer-events-auto p-1">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>

        <div class="grid grid-cols-2 gap-2 mt-3 pt-3 border-t border-gray-800 text-xs font-mono">
            <div class="bg-slate-800/80 p-2 rounded-lg">
                <span class="text-gray-400 text-[10px] block font-sans">DISTANCE FROM HQ</span>
                <span id="spotlightDistance" class="text-orange-400 font-bold text-sm">0 km</span>
            </div>
            <div class="bg-slate-800/80 p-2 rounded-lg">
                <span class="text-gray-400 text-[10px] block font-sans">LINK STATUS</span>
                <span id="spotlightStatus" class="text-emerald-400 font-bold text-xs flex items-center gap-1 mt-0.5">
                    <span class="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"></span> ACTIVE BEAM
                </span>
            </div>
        </div>
    </div>

    <script>
        // Headquarters Coordinates (India HQ Center)
        const INDIA_HQ = {
            id: 'india_hq',
            name: 'India (HQ)',
            flag: '🇮🇳',
            lat: 20.5937,
            lng: 78.9629,
            city: 'New Delhi / National Hub',
            region: 'South Asia',
            isHQ: true
        };

        // Served Client Locations (including Sri Lanka)
        const CLIENT_COUNTRIES = [
            { id: 'saudi', name: 'Saudi Arabia', flag: '🇸🇦', lat: 24.7136, lng: 46.6753, city: 'Riyadh', region: 'Middle East' },
            { id: 'uae', name: 'UAE', flag: '🇦🇪', lat: 25.2048, lng: 55.2708, city: 'Dubai', region: 'Middle East' },
            { id: 'qatar', name: 'Qatar', flag: '🇶🇦', lat: 25.2854, lng: 51.5310, city: 'Doha', region: 'Middle East' },
            { id: 'uk', name: 'United Kingdom', flag: '🇬🇧', lat: 51.5074, lng: -0.1278, city: 'London', region: 'Europe' },
            { id: 'usa', name: 'United States', flag: '🇺🇸', lat: 37.0902, lng: -95.7129, city: 'Washington D.C.', region: 'North America' },
            { id: 'canada', name: 'Canada', flag: '🇨🇦', lat: 56.1304, lng: -106.3468, city: 'Ottawa', region: 'North America' },
            { id: 'australia', name: 'Australia', flag: '🇦🇺', lat: -25.2744, lng: 133.7751, city: 'Canberra / Sydney', region: 'Oceania' },
            { id: 'nz', name: 'New Zealand', flag: '🇳🇿', lat: -40.9006, lng: 174.8860, city: 'Wellington', region: 'Oceania' },
            { id: 'bangladesh', name: 'Bangladesh', flag: '🇧🇩', lat: 23.6850, lng: 90.3563, city: 'Dhaka', region: 'South Asia' },
            { id: 'srilanka', name: 'Sri Lanka', flag: '🇱🇰', lat: 6.9271, lng: 79.8612, city: 'Colombo', region: 'South Asia' }
        ];

        // Haversine distance calculator
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        CLIENT_COUNTRIES.forEach(c => {
            c.distance = calculateDistance(INDIA_HQ.lat, INDIA_HQ.lng, c.lat, c.lng);
        });

        const ALL_LOCATIONS = [INDIA_HQ, ...CLIENT_COUNTRIES];

        const GLOBE_RADIUS = 100;
        let scene, camera, renderer, controls, globeGroup;
        let animatedPoints = [];
        let htmlMarkers = [];
        let autoRotate = true;
        let rotationSpeed = 0.0015;
        let isTourActive = false;
        let tourInterval = null;
        let currentTourIndex = 0;
        let targetCameraPos = null;
        let activeMarkerIndex = 0; // Sequential label cycling index
        let markerCycleTimer = 0;  // Timer for label cycling

        // Convert latitude / longitude to 3D Sphere Position
        function latLngToVector3(lat, lng, radius, altitude = 0) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180);
            const r = radius + altitude;
            
            const x = -(r * Math.sin(phi) * Math.cos(theta));
            const z = (r * Math.sin(phi) * Math.sin(theta));
            const y = (r * Math.cos(phi));

            return new THREE.Vector3(x, y, z);
        }

        function createLandWaterTexture(geojson) {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // 1. Water Background (Slight / Light Grey Ocean)
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Filled Land Polygons (Dark Slate-Navy Swatch)
            ctx.fillStyle = '#1c2933';
            ctx.strokeStyle = '#0e171e';
            ctx.lineWidth = 1;

            function drawRing(ring) {
                if (!ring || ring.length === 0) return;
                ctx.beginPath();
                let started = false;
                for (let i = 0; i < ring.length; i++) {
                    const pt = ring[i];
                    const x = ((pt[0] + 180) / 360) * canvas.width;
                    const y = ((90 - pt[1]) / 180) * canvas.height;
                    if (i > 0) {
                        const prevPt = ring[i - 1];
                        if (Math.abs(pt[0] - prevPt[0]) > 180) {
                            ctx.closePath();
                            ctx.fill();
                            ctx.stroke();
                            ctx.beginPath();
                            ctx.moveTo(x, y);
                            continue;
                        }
                    }
                    if (!started) {
                        ctx.moveTo(x, y);
                        started = true;
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            if (geojson && geojson.features) {
                geojson.features.forEach(feature => {
                    const geom = feature.geometry;
                    if (geom.type === 'Polygon') {
                        geom.coordinates.forEach(ring => drawRing(ring));
                    } else if (geom.type === 'MultiPolygon') {
                        geom.coordinates.forEach(poly => {
                            poly.forEach(ring => drawRing(ring));
                        });
                    }
                });
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        function initThreeGlobe() {
            const container = document.getElementById('canvas-container');

            // 1. Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);

            // 2. Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.set(0, 120, 320);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 4. Orbit Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.8;
            controls.zoomSpeed = 1.0;
            controls.minDistance = 140;
            controls.maxDistance = 600;

            // Pause auto rotation on user touch/drag
            controls.addEventListener('start', () => {
                if (!isTourActive) autoRotate = false;
            });

            // 5. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(200, 300, 200);
            scene.add(dirLight);

            // 6. Globe Master Group
            globeGroup = new THREE.Group();
            scene.add(globeGroup);

            // Solid Sphere (Light Grey Water & Dark Grey Land)
            const sphereGeo = new THREE.SphereGeometry(GLOBE_RADIUS, 64, 64);
            let globeTexture = createLandWaterTexture(null);
            const sphereMat = new THREE.MeshPhongMaterial({
                map: globeTexture,
                specular: 0x222222,
                shininess: 12
            });
            const globeSphere = new THREE.Mesh(sphereGeo, sphereMat);
            globeGroup.add(globeSphere);

            // Latitude / Longitude Wireframe Grid
            const gridGeo = new THREE.WireframeGeometry(new THREE.SphereGeometry(GLOBE_RADIUS + 0.1, 32, 16));
            const gridMat = new THREE.LineBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.25 });
            const gridLines = new THREE.LineSegments(gridGeo, gridMat);
            globeGroup.add(gridLines);

            // Load Vector Continent Polygons via GeoJSON locally
            fetch('./public/ne_110m_land.geojson')
                .then(res => res.json())
                .then(data => {
                    sphereMat.map = createLandWaterTexture(data);
                    sphereMat.needsUpdate = true;
                    renderVectorLandmasses(data);
                })
                .catch((err) => {
                    console.warn("GeoJSON land vector fallback enabled:", err);
                });

            // 7. Create Arcs and Flying Neon Green Points from India HQ to All Clients
            createVectorArcsAndFlyPoints();

            // 8. Create HTML 2D Marker Overlays
            initHTMLMarkers();

            // Focus Camera initial view towards India
            const indiaVec = latLngToVector3(INDIA_HQ.lat, INDIA_HQ.lng, GLOBE_RADIUS);
            camera.position.copy(indiaVec.clone().normalize().multiplyScalar(300));
            controls.update();

            // Window Resize Listener
            window.addEventListener('resize', onWindowResize);
        }

        function renderVectorLandmasses(geojson) {
            const landGroup = new THREE.Group();

            geojson.features.forEach(feature => {
                const geom = feature.geometry;
                if (geom.type === 'Polygon') {
                    geom.coordinates.forEach(ring => drawPolyRing(ring, landGroup));
                } else if (geom.type === 'MultiPolygon') {
                    geom.coordinates.forEach(poly => {
                        poly.forEach(ring => drawPolyRing(ring, landGroup));
                    });
                }
            });

            globeGroup.add(landGroup);
        }

        function drawPolyRing(coords, parentGroup) {
            const points = [];
            coords.forEach(pt => {
                const lng = pt[0];
                const lat = pt[1];
                points.push(latLngToVector3(lat, lng, GLOBE_RADIUS + 0.3));
            });

            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({
                color: 0x0f172a, // Sharp Dark Slate Outlines
                linewidth: 1,
                transparent: true,
                opacity: 0.6
            });
            const line = new THREE.Line(geometry, material);
            parentGroup.add(line);
        }

        // Build a robust 3D arc curve between two surface points using great-circle slerp + altitude bulge.
        // Works for ANY distance including near-antipodal (India → USA).
        function buildArcCurve(startPos, endPos, segments) {
            segments = segments || 64;
            const startDir = startPos.clone().normalize();
            const endDir = endPos.clone().normalize();
            const dot = startDir.dot(endDir);
            const angularDist = Math.acos(THREE.MathUtils.clamp(dot, -1, 1)); // angle in radians
            const maxAlt = 2.0 + Math.min(angularDist * GLOBE_RADIUS * 0.08, 18.0); // low, subtle arc height

            const pts = [];
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;

                // Spherical linear interpolation (slerp) for direction
                let dir;
                if (Math.abs(dot) > 0.9999) {
                    // Near-identical or near-antipodal: use fallback perpendicular arc via north pole
                    const perp = new THREE.Vector3(0, 1, 0);
                    if (Math.abs(startDir.dot(perp)) > 0.95) perp.set(1, 0, 0);
                    const mid = startDir.clone().add(perp).normalize();
                    // Two-leg slerp: start → mid → end
                    if (t <= 0.5) {
                        dir = startDir.clone().lerp(mid, t * 2).normalize();
                    } else {
                        dir = mid.clone().lerp(endDir, (t - 0.5) * 2).normalize();
                    }
                } else {
                    // Standard slerp
                    const sinTotal = Math.sin(angularDist);
                    const a = Math.sin((1 - t) * angularDist) / sinTotal;
                    const b = Math.sin(t * angularDist) / sinTotal;
                    dir = startDir.clone().multiplyScalar(a).add(endDir.clone().multiplyScalar(b)).normalize();
                }

                // Altitude bulge: sine curve peaking at midpoint
                const alt = Math.sin(t * Math.PI) * maxAlt;
                pts.push(dir.multiplyScalar(GLOBE_RADIUS + 0.5 + alt));
            }
            return new THREE.CatmullRomCurve3(pts);
        }

        // Sequential Arc System: arcs accumulate on screen, reset after all done
        let arcSequenceData = [];       // Pre-computed curve data per client
        let currentArcIndex = 0;        // Which client arc is currently drawing
        let arcDrawProgress = 0;        // 0→1 draw progress of the current arc
        let arcPhase = 'drawing';       // 'drawing' | 'holding' | 'resetting'
        let arcHoldTimer = 0;
        let activeTubeMesh = null;      // Currently drawing tube (partial)
        let activeGlowMesh = null;      // Currently drawing glow (partial)
        let activeFlyPoint = null;      // The traveling photon dot
        let completedMeshes = [];       // All completed arc meshes (persist until reset)
        let completedClientMarkers = []; // Completed client rings & dots
        let currentResetOpacity = 1.0;  // Sync label opacity during reset phase
        const ARC_DRAW_SPEED = 0.014;
        const ARC_HOLD_FRAMES = 60;     // Brief pause after each arc completes (~1s)
        const RESET_HOLD_FRAMES = 120;  // Pause showing all arcs before reset (~2s)
        const ACCENT_COLOR = 0xbcdc00;

        function createVectorArcsAndFlyPoints() {
            const hqPos = latLngToVector3(INDIA_HQ.lat, INDIA_HQ.lng, GLOBE_RADIUS + 0.5);

            // Ground Beacon Ring at HQ — always visible
            const hqRingGeo = new THREE.RingGeometry(2.0, 3.6, 32);
            const hqRingMat = new THREE.MeshBasicMaterial({ color: ACCENT_COLOR, side: THREE.DoubleSide, transparent: true, opacity: 0.95 });
            const hqRing = new THREE.Mesh(hqRingGeo, hqRingMat);
            hqRing.position.copy(hqPos);
            hqRing.lookAt(hqPos.clone().multiplyScalar(2));
            globeGroup.add(hqRing);

            // Center HQ Dot — always visible
            const hqDotGeo = new THREE.SphereGeometry(2.0, 16, 16);
            const hqDotMat = new THREE.MeshBasicMaterial({ color: ACCENT_COLOR });
            const hqDot = new THREE.Mesh(hqDotGeo, hqDotMat);
            hqDot.position.copy(hqPos);
            globeGroup.add(hqDot);

            // Pre-compute curve data for each client
            CLIENT_COUNTRIES.forEach((client) => {
                const clientPos = latLngToVector3(client.lat, client.lng, GLOBE_RADIUS + 0.5);
                const curve = buildArcCurve(hqPos, clientPos, 80);
                arcSequenceData.push({
                    client: client,
                    clientPos: clientPos,
                    curve: curve
                });
            });

            // Create the reusable flying photon
            const pointGeo = new THREE.SphereGeometry(1.8, 16, 16);
            const pointMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            activeFlyPoint = new THREE.Mesh(pointGeo, pointMat);
            const haloGeo = new THREE.SphereGeometry(3.4, 16, 16);
            const haloMat = new THREE.MeshBasicMaterial({ color: ACCENT_COLOR, transparent: true, opacity: 0.7 });
            activeFlyPoint.add(new THREE.Mesh(haloGeo, haloMat));
            activeFlyPoint.visible = false;
            globeGroup.add(activeFlyPoint);

            // Start the first arc
            startDrawingArc();
        }

        function startDrawingArc() {
            // Clean up the in-progress tube (not completed ones!)
            if (activeTubeMesh) { globeGroup.remove(activeTubeMesh); activeTubeMesh.geometry.dispose(); activeTubeMesh = null; }
            if (activeGlowMesh) { globeGroup.remove(activeGlowMesh); activeGlowMesh.geometry.dispose(); activeGlowMesh = null; }

            const data = arcSequenceData[currentArcIndex];

            activeFlyPoint.visible = true;
            activeFlyPoint.position.copy(data.curve.getPoint(0));

            arcDrawProgress = 0;
            arcPhase = 'drawing';
            arcHoldTimer = 0;
        }

        function finalizeCurrentArc() {
            // Convert the current drawing arc into a permanent completed arc
            const data = arcSequenceData[currentArcIndex];

            // Remove the partial tube
            if (activeTubeMesh) { globeGroup.remove(activeTubeMesh); activeTubeMesh.geometry.dispose(); activeTubeMesh = null; }
            if (activeGlowMesh) { globeGroup.remove(activeGlowMesh); activeGlowMesh.geometry.dispose(); activeGlowMesh = null; }

            // Create permanent full-length tube
            const tubeGeo = new THREE.TubeGeometry(data.curve, 80, 0.32, 8, false);
            const tubeMat = new THREE.MeshBasicMaterial({ color: ACCENT_COLOR });
            const tubeMesh = new THREE.Mesh(tubeGeo, tubeMat);
            globeGroup.add(tubeMesh);
            completedMeshes.push(tubeMesh);

            const glowGeo = new THREE.TubeGeometry(data.curve, 80, 0.75, 8, false);
            const glowMat = new THREE.MeshBasicMaterial({ color: ACCENT_COLOR, transparent: true, opacity: 0.3 });
            const glowMesh = new THREE.Mesh(glowGeo, glowMat);
            globeGroup.add(glowMesh);
            completedMeshes.push(glowMesh);

            // Create permanent client ring & dot at destination
            const cRingGeo = new THREE.RingGeometry(1.4, 2.6, 32);
            const cRingMat = new THREE.MeshBasicMaterial({ color: ACCENT_COLOR, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
            const cRing = new THREE.Mesh(cRingGeo, cRingMat);
            cRing.position.copy(data.clientPos);
            cRing.lookAt(data.clientPos.clone().multiplyScalar(2));
            globeGroup.add(cRing);
            completedClientMarkers.push(cRing);

            const cDotGeo = new THREE.SphereGeometry(1.6, 16, 16);
            const cDotMat = new THREE.MeshBasicMaterial({ color: ACCENT_COLOR });
            const cDot = new THREE.Mesh(cDotGeo, cDotMat);
            cDot.position.copy(data.clientPos);
            globeGroup.add(cDot);
            completedClientMarkers.push(cDot);
        }

        function clearAllCompletedArcs() {
            // Remove all accumulated arc meshes and client markers
            completedMeshes.forEach(m => { globeGroup.remove(m); if (m.geometry) m.geometry.dispose(); });
            completedMeshes = [];
            completedClientMarkers.forEach(m => { globeGroup.remove(m); if (m.geometry) m.geometry.dispose(); });
            completedClientMarkers = [];
        }

        function updateSequentialArc() {
            if (arcSequenceData.length === 0) return;
            const data = arcSequenceData[currentArcIndex];

            if (arcPhase === 'drawing') {
                arcDrawProgress += ARC_DRAW_SPEED;
                if (arcDrawProgress >= 1) {
                    arcDrawProgress = 1;
                    arcPhase = 'holding';
                    arcHoldTimer = 0;
                    // Finalize this arc as permanent
                    finalizeCurrentArc();
                    activeFlyPoint.visible = false;
                }

                // Only rebuild partial tube while still drawing
                if (arcPhase === 'drawing') {
                    if (activeTubeMesh) { globeGroup.remove(activeTubeMesh); activeTubeMesh.geometry.dispose(); }
                    if (activeGlowMesh) { globeGroup.remove(activeGlowMesh); activeGlowMesh.geometry.dispose(); }

                    const segCount = Math.max(2, Math.floor(80 * arcDrawProgress));
                    const partialPts = [];
                    for (let i = 0; i <= segCount; i++) {
                        const t = (i / segCount) * arcDrawProgress;
                        partialPts.push(data.curve.getPoint(t));
                    }
                    const partialCurve = new THREE.CatmullRomCurve3(partialPts);

                    const tubeGeo = new THREE.TubeGeometry(partialCurve, segCount, 0.32, 8, false);
                    const tubeMat = new THREE.MeshBasicMaterial({ color: ACCENT_COLOR });
                    activeTubeMesh = new THREE.Mesh(tubeGeo, tubeMat);
                    globeGroup.add(activeTubeMesh);

                    const glowGeo = new THREE.TubeGeometry(partialCurve, segCount, 0.75, 8, false);
                    const glowMat = new THREE.MeshBasicMaterial({ color: ACCENT_COLOR, transparent: true, opacity: 0.3 });
                    activeGlowMesh = new THREE.Mesh(glowGeo, glowMat);
                    globeGroup.add(activeGlowMesh);

                    // Move flying photon to leading edge
                    activeFlyPoint.position.copy(data.curve.getPoint(arcDrawProgress));
                }

            } else if (arcPhase === 'holding') {
                arcHoldTimer++;

                const isLastArc = currentArcIndex >= arcSequenceData.length - 1;
                const holdDuration = isLastArc ? RESET_HOLD_FRAMES : ARC_HOLD_FRAMES;

                if (arcHoldTimer >= holdDuration) {
                    if (isLastArc) {
                        // All countries done — reset everything and restart
                        arcPhase = 'resetting';
                        arcHoldTimer = 0;
                    } else {
                        // Move to next country
                        currentArcIndex++;
                        startDrawingArc();
                    }
                }

            } else if (arcPhase === 'resetting') {
                arcHoldTimer++;
                const fadeProgress = arcHoldTimer / 40; // fade out over ~0.7s
                currentResetOpacity = Math.max(0, 1 - fadeProgress);

                // Fade all completed arcs
                completedMeshes.forEach(m => {
                    if (!m.material.transparent) m.material.transparent = true;
                    m.material.opacity = Math.max(0, 1 - fadeProgress);
                });
                completedClientMarkers.forEach(m => {
                    if (!m.material.transparent) m.material.transparent = true;
                    m.material.opacity = Math.max(0, 1 - fadeProgress);
                });

                if (fadeProgress >= 1) {
                    // Clear and restart from country 1
                    clearAllCompletedArcs();
                    currentArcIndex = 0;
                    currentResetOpacity = 1.0;
                    startDrawingArc();
                }
            }
        }

        function initHTMLMarkers() {
            const container = document.getElementById('html-markers-container');
            container.innerHTML = '';
            htmlMarkers = [];

            ALL_LOCATIONS.forEach((loc, idx) => {
                const el = document.createElement('div');
                el.className = 'globe-label flex items-center gap-1.5 bg-white/90 backdrop-blur-md px-2.5 py-1 rounded-full shadow-md border border-gray-200 text-xs font-bold text-gray-800 hover:border-[#bcdc00] hover:text-lime-700';
                el.style.transition = 'opacity 0.5s ease, transform 0.5s ease, left 0.1s, top 0.1s';
                
                if (loc.isHQ) {
                    el.innerHTML = `<span class="h-2 w-2 rounded-full bg-[#bcdc00] animate-ping"></span><span>🇮🇳</span> <span class="text-lime-700 font-black">HQ: INDIA</span>`;
                    el.classList.add('ring-2', 'ring-[#bcdc00]', 'ring-offset-1');
                } else {
                    el.innerHTML = `<span class="text-xs">${loc.flag}</span> <span>${loc.name}</span>`;
                }

                el.onclick = () => {
                    stopTour();
                    selectCountry(loc);
                };

                container.appendChild(el);

                htmlMarkers.push({
                    element: el,
                    pos3D: latLngToVector3(loc.lat, loc.lng, GLOBE_RADIUS + 1.5),
                    isHQ: !!loc.isHQ
                });
            });

            // Labels are now synced to the sequential arc system (no separate timer needed)
        }

        // Project 3D vector coordinates to 2D HTML Screen Coordinates
        // HQ label: always visible. Client labels: one at a time, serially.
        function updateHTMLMarkersPosition() {
            const tempV = new THREE.Vector3();
            let clientIdx = 0; // track which client we're on (skip HQ)

            htmlMarkers.forEach((m, i) => {
                tempV.copy(m.pos3D);
                tempV.applyMatrix4(globeGroup.matrixWorld);

                const distanceToCam = tempV.distanceTo(camera.position);
                const globeCenterDist = camera.position.distanceTo(globeGroup.position);

                tempV.project(camera);

                const isBehind = distanceToCam > globeCenterDist;
                const x = (tempV.x *  .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;
                const offScreen = Math.abs(tempV.x) > 1.1 || Math.abs(tempV.y) > 1.1;

                if (m.isHQ) {
                    // HQ always visible (when in front)
                    if (isBehind || offScreen) {
                        m.element.style.opacity = '0';
                        m.element.style.pointerEvents = 'none';
                    } else {
                        m.element.style.display = 'flex';
                        m.element.style.left = `${x}px`;
                        m.element.style.top = `${y}px`;
                        m.element.style.opacity = '1';
                        m.element.style.pointerEvents = 'auto';
                    }
                } else {
                    // Client labels: show for all completed arcs + the currently drawing one (when near completion)
                    const myIdx = clientIdx;
                    clientIdx++;

                    let isVisible = false;
                    if (arcPhase === 'resetting') {
                        // During reset, keep labels visible but they'll disappear with the arcs
                        isVisible = myIdx <= currentArcIndex;
                    } else if (myIdx < currentArcIndex) {
                        // Already completed — stay visible
                        isVisible = true;
                    } else if (myIdx === currentArcIndex) {
                        // Currently drawing — show when arc is >50% drawn, or holding
                        isVisible = (arcPhase === 'drawing' && arcDrawProgress > 0.5) || arcPhase === 'holding';
                    }

                    if (isBehind || offScreen || !isVisible) {
                        m.element.style.opacity = '0';
                        m.element.style.pointerEvents = 'none';
                    } else {
                        m.element.style.display = 'flex';
                        m.element.style.left = `${x}px`;
                        m.element.style.top = `${y}px`;
                        m.element.style.opacity = arcPhase === 'resetting' ? `${currentResetOpacity}` : '1';
                        m.element.style.pointerEvents = 'auto';
                    }
                }
            });
        }

        function renderCountryList() {
            const listContainer = document.getElementById('countryList');
            if (!listContainer) return;
            listContainer.innerHTML = '';

            CLIENT_COUNTRIES.forEach(country => {
                const card = document.createElement('div');
                card.id = `item-${country.id}`;
                card.className = 'country-item flex items-center justify-between p-2 rounded-xl border border-gray-100 hover:border-orange-300 hover:bg-orange-50/50 cursor-pointer transition text-xs group';
                
                card.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-base group-hover:scale-110 transition-transform">${country.flag}</span>
                        <div>
                            <div class="font-bold text-gray-800 group-hover:text-orange-600 transition-colors">${country.name}</div>
                            <div class="text-[10px] text-gray-400 font-mono">${country.city}</div>
                        </div>
                    </div>
                    <div class="text-right font-mono">
                        <div class="text-[11px] font-semibold text-gray-600">${country.distance.toLocaleString()} km</div>
                        <div class="text-[9px] text-emerald-600 font-bold flex items-center justify-end gap-1">
                            <span class="h-1 w-1 rounded-full bg-emerald-500"></span> Active
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    stopTour();
                    selectCountry(country);
                });

                listContainer.appendChild(card);
            });
        }

        function selectCountry(country) {
            document.querySelectorAll('.country-item').forEach(el => {
                el.classList.remove('border-orange-500', 'bg-orange-50', 'shadow-sm');
            });

            const activeEl = document.getElementById(`item-${country.id}`);
            if (activeEl) {
                activeEl.classList.add('border-orange-500', 'bg-orange-50', 'shadow-sm');
                activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // Target camera positioning
            const targetVec = latLngToVector3(country.lat, country.lng, GLOBE_RADIUS);
            const worldVec = targetVec.clone().applyMatrix4(globeGroup.matrixWorld);
            
            // Set camera focus smoothly
            targetCameraPos = worldVec.clone().normalize().multiplyScalar(260);

            showSpotlight(country);
        }

        function showSpotlight(data) {
            const spotlight = document.getElementById('spotlightCard');
            if (!spotlight) return;
            const flagEl = document.getElementById('spotlightFlag');
            const nameEl = document.getElementById('spotlightName');
            const regEl = document.getElementById('spotlightRegion');
            const distEl = document.getElementById('spotlightDistance');
            const statEl = document.getElementById('spotlightStatus');

            if (flagEl) flagEl.textContent = data.flag;
            if (nameEl) nameEl.textContent = data.name;
            if (regEl) regEl.textContent = `${data.city} • ${data.region}`;
            
            if (distEl && statEl) {
                if (data.isHQ) {
                    distEl.textContent = '0 km (HUB)';
                    statEl.innerHTML = `<span class="h-1.5 w-1.5 rounded-full bg-red-400 animate-ping"></span> CENTRAL HQ`;
                } else {
                    distEl.textContent = `${data.distance.toLocaleString()} km from HQ`;
                    statEl.innerHTML = `<span class="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"></span> ACTIVE BEAM`;
                }
            }

            spotlight.classList.remove('translate-y-3', 'opacity-0', 'pointer-events-none');
            spotlight.classList.add('translate-y-0', 'opacity-100');
        }

        function hideSpotlight() {
            const spotlight = document.getElementById('spotlightCard');
            if (!spotlight) return;
            spotlight.classList.add('translate-y-3', 'opacity-0', 'pointer-events-none');
            spotlight.classList.remove('translate-y-0', 'opacity-100');
        }

        function toggleTour() {
            if (isTourActive) {
                stopTour();
            } else {
                startTour();
            }
        }

        function startTour() {
            isTourActive = true;
            autoRotate = false;
            const label = document.getElementById('tourBtnLabel');
            const icon = document.getElementById('tourIcon');
            const status = document.getElementById('tourStatusText');
            if (label) label.textContent = 'Pause Tour';
            if (icon) icon.className = 'fa-solid fa-pause text-xs';
            if (status) {
                status.textContent = 'Active Tour Mode';
                status.className = 'text-orange-600 font-bold animate-pulse';
            }

            runTourStep();
            tourInterval = setInterval(runTourStep, 4500);
        }

        function runTourStep() {
            const country = CLIENT_COUNTRIES[currentTourIndex];
            selectCountry(country);
            currentTourIndex = (currentTourIndex + 1) % CLIENT_COUNTRIES.length;
        }

        function stopTour() {
            isTourActive = false;
            clearInterval(tourInterval);
            const label = document.getElementById('tourBtnLabel');
            const icon = document.getElementById('tourIcon');
            const status = document.getElementById('tourStatusText');
            if (label) label.textContent = 'Start Tour';
            if (icon) icon.className = 'fa-solid fa-play text-xs';
            if (status) {
                status.textContent = 'Auto-Rotation';
                status.className = 'text-blue-600 font-bold';
            }
            autoRotate = true;
        }

        function setupEventListeners() {
            document.getElementById('resetViewBtn')?.addEventListener('click', () => {
                stopTour();
                hideSpotlight();
                targetCameraPos = latLngToVector3(INDIA_HQ.lat, INDIA_HQ.lng, GLOBE_RADIUS).normalize().multiplyScalar(300);
            });

            document.getElementById('toggleTourBtn')?.addEventListener('click', toggleTour);

            document.getElementById('speedToggleBtn')?.addEventListener('click', () => {
                if (rotationSpeed === 0.0015) {
                    rotationSpeed = 0.004;
                } else if (rotationSpeed === 0.004) {
                    rotationSpeed = 0.008;
                } else {
                    rotationSpeed = 0.0015;
                }
            });

            document.getElementById('closeSpotlightBtn')?.addEventListener('click', hideSpotlight);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Rotate globe vector mesh
            if (autoRotate && globeGroup) {
                globeGroup.rotation.y += rotationSpeed;
            }

            // Sequential arc animation: one arc at a time from India → destination
            updateSequentialArc();

            // Smooth camera transition when selecting locations
            if (targetCameraPos) {
                camera.position.lerp(targetCameraPos, 0.05);
                if (camera.position.distanceTo(targetCameraPos) < 1.0) {
                    targetCameraPos = null;
                }
            }

            controls.update();
            updateHTMLMarkersPosition();
            renderer.render(scene, camera);
        }

        window.onload = function() {
            renderCountryList();
            initThreeGlobe();
            setupEventListeners();
            animate();
        };
    </script>
</body>
</html>
